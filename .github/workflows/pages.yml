name: Godot Web → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: '4.6.3'
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and web export templates
        shell: bash
        run: |
          set -euo pipefail
          release="${GODOT_VERSION}-stable"
          base="https://github.com/godotengine/godot-builds/releases/download/$release"
          binary="Godot_v${release}_linux.x86_64"
          templates="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$RUNNER_TEMP/godot-bin" "$templates"
          curl --fail --location --retry 3 "$base/$binary.zip" -o "$RUNNER_TEMP/godot.zip"
          curl --fail --location --retry 3 "$base/Godot_v${release}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          unzip -jq "$RUNNER_TEMP/templates.tpz" 'templates/web_nothreads_*.zip' -d "$templates"
          echo "GODOT_BIN=$RUNNER_TEMP/godot-bin/$binary" >> "$GITHUB_ENV"
      - name: Export and check game files
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/mechanic-web"
          release="play-${GITHUB_SHA::12}"
          mkdir -p "$site"
          bash deploy/build.sh "$site/$release"
          cat > "$site/index.html" <<HTML
          <!doctype html>
          <html lang="ru">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0; url=./$release/">
          <title>Механик Петербурга</title>
          <a href="./$release/">Открыть игру</a>
          </html>
          HTML
      - name: Test touch movement in the web build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium
          python3 - "$RUNNER_TEMP/mechanic-web/play-${GITHUB_SHA::12}" <<'PY'
          from functools import partial
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from io import BytesIO
          from PIL import Image, ImageChops
          from playwright.sync_api import sync_playwright
          import sys
          import threading

          server = ThreadingHTTPServer(
              ("127.0.0.1", 0), partial(SimpleHTTPRequestHandler, directory=sys.argv[1])
          )
          threading.Thread(target=server.serve_forever, daemon=True).start()
          with sync_playwright() as pw:
              browser = pw.chromium.launch(args=[
                  "--use-gl=angle", "--use-angle=swiftshader", "--enable-unsafe-swiftshader"
              ])
              page = browser.new_page(
                  viewport={"width": 390, "height": 844}, is_mobile=True, has_touch=True
              )
              page.on("pageerror", lambda error: print(error, flush=True))
              page.on("console", lambda message: print(message.text, flush=True)
                      if message.type in ("error", "warning") else None)
              page.goto(f"http://127.0.0.1:{server.server_port}/")
              page.locator("#status").wait_for(state="hidden", timeout=30000)
              page.wait_for_function("window.mechanicStick != null", timeout=30000)
              page.wait_for_timeout(1200)
              canvas = page.locator("#canvas")
              box = canvas.bounding_box()
              print(f"Canvas: {box}", flush=True)
              scale = min(box["width"] / 1152, box["height"] / 648)
              left = box["x"] + (box["width"] - 1152 * scale) / 2
              top = box["y"] + (box["height"] - 648 * scale) / 2

              def room_pixels():
                  return Image.open(BytesIO(page.screenshot())).convert("RGB").crop((
                      round(left + 170 * scale), round(top + 135 * scale),
                      round(left + 970 * scale), round(top + 440 * scale),
                  ))

              touch = page.context.new_cdp_session(page)
              page.evaluate("""() => {
                  window.touchTrace = [];
                  for (const name of ["pointerdown", "pointermove", "pointercancel", "touchstart", "touchcancel"]) {
                      window.addEventListener(name, e => window.touchTrace.push(
                          [name, e.target.id, e.clientX, e.clientY, e.pointerType]), true);
                  }
              }""")
              before = room_pixels()
              touch.send("Input.dispatchTouchEvent", {
                  "type": "touchStart",
                  "touchPoints": [{"x": left + 154 * scale, "y": top + 544 * scale}],
              })
              try:
                  # Allow the software renderer time to draw movement.
                  for _ in range(20):
                      page.wait_for_timeout(150)
                      if ImageChops.difference(before, room_pixels()).getbbox():
                          break
                  else:
                      print(page.evaluate("({stick: window.mechanicStick, trace: window.touchTrace})"), flush=True)
                      print(f"Room baseline: {before.getbbox()}", flush=True)
                      raise AssertionError("Touch changed no pixels in the room")
              finally:
                  touch.send("Input.dispatchTouchEvent", {"type": "touchEnd", "touchPoints": []})
              page.wait_for_timeout(250)
              stopped = room_pixels()
              page.wait_for_timeout(250)
              assert not ImageChops.difference(stopped, room_pixels()).getbbox(), "Room kept moving after release"
              print("PASS: the exported web game walks and stops with touch")
          PY
      - name: Show Godot log if export failed
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/mechanic-web/play-${GITHUB_SHA::12}/build.log" ]]; then
            cat "$RUNNER_TEMP/mechanic-web/play-${GITHUB_SHA::12}/build.log"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mechanic-web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
