name: Godot Web → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: '4.6.3'
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and web export templates
        shell: bash
        run: |
          set -euo pipefail
          release="${GODOT_VERSION}-stable"
          base="https://github.com/godotengine/godot-builds/releases/download/$release"
          binary="Godot_v${release}_linux.x86_64"
          templates="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$RUNNER_TEMP/godot-bin" "$templates"
          curl --fail --location --retry 3 "$base/$binary.zip" -o "$RUNNER_TEMP/godot.zip"
          curl --fail --location --retry 3 "$base/Godot_v${release}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          unzip -jq "$RUNNER_TEMP/templates.tpz" 'templates/web_nothreads_*.zip' -d "$templates"
          echo "GODOT_BIN=$RUNNER_TEMP/godot-bin/$binary" >> "$GITHUB_ENV"
      - name: Export and check game files
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/mechanic-web"
          release="play-${GITHUB_SHA::12}"
          mkdir -p "$site"
          bash deploy/build.sh "$site/$release"
          cat > "$site/index.html" <<HTML
          <!doctype html>
          <html lang="ru">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0; url=./$release/">
          <title>Механик Петербурга</title>
          <a href="./$release/">Открыть игру</a>
          </html>
          HTML
      - name: Show Godot log if export failed
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/mechanic-web/play-${GITHUB_SHA::12}/build.log" ]]; then
            cat "$RUNNER_TEMP/mechanic-web/play-${GITHUB_SHA::12}/build.log"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mechanic-web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
